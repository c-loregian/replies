<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Replies">
<meta name="theme-color" content="#ffffff">
<title>Replies</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#777; --line:#eee; --accent:#c13584; --warn:#d97706; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f2; --muted:#999; --line:#222; --accent:#e1306c; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg);
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px;
           display:flex; align-items:center; gap:10px; z-index:2; }
  header h1 { font-size:18px; margin:0; flex:1; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:var(--line); color:var(--fg); }
  button.primary { background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  .muted { color:var(--muted); font-size:14px; }
  .wrap { padding:16px; }
  textarea, input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px;
                    background:var(--bg); color:var(--fg); }
  ul { list-style:none; margin:0; padding:0; }
  li.chat { display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); align-items:flex-start; }
  li.chat.expired { opacity:.45; }
  .who { font-weight:600; }
  .preview { color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .grow { flex:1; min-width:0; }
  .timer { font-size:13px; white-space:nowrap; font-weight:600; }
  .timer.soon { color:var(--warn); } .timer.gone { color:var(--muted); font-weight:400; }
  .msgs { padding:12px 16px 140px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:16px; background:var(--line); white-space:pre-wrap; word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg time { display:block; font-size:11px; opacity:.7; margin-top:2px; }
  .composer { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line);
              padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; }
  .composer textarea { min-height:44px; max-height:140px; resize:none; }
  .err { color:var(--bad); font-size:14px; padding:8px 16px; }
  a.btn { display:inline-block; text-decoration:none; color:var(--fg); background:var(--line); border-radius:10px; padding:10px 14px; }
  .empty { text-align:center; padding:48px 16px; color:var(--muted); }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- Setup screen -->
<section id="setup" class="hidden">
  <header><h1>Set up</h1></header>
  <div class="wrap">
    <p>Paste Instagram access key. It is saved only in this browser on this phone.</p>
    <textarea id="tokenInput" rows="4" placeholder="EAA... or IGAA..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <p class="muted">Instagram account ID:</p>
    <input id="igIdInput" inputmode="numeric" placeholder="e.g. 17841400000000000" autocomplete="off">
    <p><button class="primary" id="saveToken">Save</button></p>
    <p class="err" id="setupErr"></p>
  </div>
</section>

<!-- Waiting list -->
<section id="list" class="hidden">
  <header>
    <h1>Waiting on you <span id="count" class="muted"></span></h1>
    <button id="refresh">Refresh</button>
    <button id="menu" aria-label="Settings">⋯</button>
  </header>
  <div id="barWrap" class="hidden" style="height:3px;background:var(--line)"><div id="bar" style="height:3px;width:0;background:var(--accent);transition:width .3s"></div></div>
  <p class="muted wrap" id="status" style="padding-bottom:0"></p>
  <p class="err" id="listErr"></p>
  <ul id="chats"></ul>
</section>

<!-- Chat view -->
<section id="chat" class="hidden">
  <header>
    <button id="back">Back</button>
    <h1 id="chatName"></h1>
    <a class="btn" id="openIg" href="#" target="_blank" rel="noopener">Open in IG</a>
  </header>
  <p class="err" id="chatErr"></p>
  <div class="msgs" id="msgs"></div>
  <form class="composer" id="composer">
    <textarea id="replyText" rows="1" placeholder="Reply…"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</section>

<!-- Settings -->
<section id="settings" class="hidden">
  <header><button id="settingsBack">Back</button><h1>Settings</h1></header>
  <div class="wrap">
    <p class="muted" id="acctInfo"></p>
    <p><button id="forget">Remove access key from this phone</button></p>
    <p class="muted">Removing the key here does not cancel it. To cancel it, go to your app in developers.facebook.com.</p>
  </div>
</section>

<script>
(() => {
  // IGAA keys (Instagram login) use graph.instagram.com; EAA keys (Unified / Facebook login) use graph.facebook.com
  const apiBase = () => (token && token.startsWith("IG") ? "https://graph.instagram.com/v26.0" : "https://graph.facebook.com/v26.0");
  const isIgKey = () => !!token && token.startsWith("IG");
  const LOOKBACK_DAYS = 7;           // how far back to look (longest possible reply window)
  const PAGE_SIZE = 25;              // chats per request: smaller = list appears sooner
  const MAX_PAGES = 80;              // safety stop (2,000 chats)
  const TIMEOUT_MS = 25000;
  const WINDOW_H = 24;               // standard reply window
  const REFRESH_AFTER_DAYS = 7;      // renew the 60-day key weekly

  // ---------- storage (may be unavailable) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let token = store.get("ig_token");
  let igId = store.get("ig_id");   // Instagram account ID (needed for EAA keys)
  let me = null;            // {id, user_id, username}
  let current = null;       // open conversation

  const $ = id => document.getElementById(id);
  const show = id => ["setup","list","chat","settings"].forEach(s => $(s).classList.toggle("hidden", s !== id));

  // ---------- API ----------
  async function api(path, params = {}, method = "GET") {
    const p = new URLSearchParams({ ...params, access_token: token });
    const url = path.startsWith("http") ? path : apiBase() + path;
    let res;
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), TIMEOUT_MS);
    try {
      if (method === "GET") {
        res = await fetch(url + (url.includes("?") ? "&" : "?") + p, { signal: ctl.signal });
      } else {
        // form-encoded body keeps it a "simple" request (no preflight)
        res = await fetch(url, { method, body: p, signal: ctl.signal });
      }
    } catch (err) {
      if (err.name === "AbortError") throw new Error("Instagram took more than " + TIMEOUT_MS / 1000 + "s to answer. Tap Refresh to try again.");
      throw err;
    } finally { clearTimeout(to); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      const e = new Error((data.error && data.error.message) || ("HTTP " + res.status));
      e.code = data.error && data.error.code;
      throw e;
    }
    return data;
  }

  async function maybeRefreshToken() {
    const last = Number(store.get("ig_token_refreshed") || 0);
    if (!isIgKey() || Date.now() - last < REFRESH_AFTER_DAYS * 864e5) return;
    try {
      const r = await api("https://graph.instagram.com/refresh_access_token", { grant_type: "ig_refresh_token" });
      if (r.access_token) { token = r.access_token; store.set("ig_token", token); }
      store.set("ig_token_refreshed", String(Date.now()));
    } catch { /* key under 24h old, or refresh failed: try again next time */ }
  }

  // Which Instagram account the key belongs to
  const acct = () => (isIgKey() ? "/me" : "/" + me.user_id);
  async function getMe() {
    if (isIgKey()) return api("/me", { fields: "id,user_id,username" });
    if (!igId) {
      try {
        const r = await api("/me/accounts", { fields: "instagram_business_account{id,username}" });
        const pg = (r.data || []).find(p => p.instagram_business_account);
        if (pg) igId = pg.instagram_business_account.id;
      } catch { /* key can't list Pages */ }
    }
    if (!igId) {
      const e = new Error("Couldn't find the Instagram account for this key. Enter the Instagram account ID below the key and save again.");
      e.code = "NEED_ID"; throw e;
    }
    const a = await api("/" + igId, { fields: "id,username" });
    return { id: a.id, user_id: a.id, username: a.username };
  }

  const isMe = from => from && me && (from.id === me.user_id || from.id === me.id || from.username === me.username);

  // ---------- waiting list ----------
  let loading = false;
  async function loadList() {
    if (loading) return;
    loading = true;
    $("listErr").textContent = "";
    $("refresh").disabled = true;
    const t0 = Date.now();
    let checked = 0, oldestSeen = Date.now(), waitingCount = 0;
    const cutoff = Date.now() - LOOKBACK_DAYS * 864e5;
    const bar = $("bar");
    const progress = () => {
      const pct = Math.min(100, Math.round(100 * (Date.now() - oldestSeen) / (Date.now() - cutoff)));
      bar.style.width = pct + "%";
      const secs = Math.round((Date.now() - t0) / 1000);
      const back = checked ? " · checked back to " + new Date(oldestSeen).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";
      $("status").textContent = "Loading " + pct + "% · " + checked + " chats checked · " + waitingCount + " waiting" + back + " · " + secs + "s";
    };
    $("barWrap").classList.remove("hidden");
    progress();
    const tick = setInterval(progress, 500);
    try {
      if (!me) me = await getMe();
      const fields = "id,updated_time,participants,messages.limit(1){id,from,message,created_time}";
      const waiting = [];
      let page = await api(acct() + "/conversations", { platform: "instagram", fields, limit: String(PAGE_SIZE) });
      for (let i = 0; i < MAX_PAGES && page; i++) {
        let done = false;
        for (const c of page.data || []) {
          const upd = new Date(c.updated_time).getTime();
          if (upd < cutoff) { done = true; break; }
          checked++; oldestSeen = upd;
          const last = c.messages && c.messages.data && c.messages.data[0];
          if (!last || isMe(last.from)) continue;
          const other = ((c.participants && c.participants.data) || []).find(p => !isMe(p)) || last.from || {};
          waiting.push({ id: c.id, other, last, at: new Date(last.created_time).getTime() });
        }
        waitingCount = waiting.length;
        waiting.sort((a, b) => b.at - a.at);
        renderList(waiting);            // show results as they arrive
        progress();
        if (done || !page.paging || !page.paging.next) break;
        const next = new URL(page.paging.next);
        next.searchParams.delete("access_token");
        page = await api(next.toString());
      }
      $("status").textContent = waitingCount + " waiting · " + checked + " chats checked from the last " + LOOKBACK_DAYS +
        " days · took " + Math.round((Date.now() - t0) / 1000) + "s · updated " +
        new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    } catch (e) {
      $("status").textContent = "";
      handleErr(e, "listErr");
    } finally {
      clearInterval(tick);
      $("barWrap").classList.add("hidden");
      $("refresh").disabled = false;
      loading = false;
    }
  }

  function timeLeft(at) {
    const ms = at + WINDOW_H * 36e5 - Date.now();
    if (ms <= 0) return { text: "24h passed", cls: "gone", expired: true };
    const h = Math.floor(ms / 36e5), m = Math.floor((ms % 36e5) / 6e4);
    return { text: h ? h + "h left" : m + "m left", cls: h < 4 ? "soon" : "", expired: false };
  }

  function renderList(items) {
    $("count").textContent = items.length ? "(" + items.length + ")" : "";
    const ul = $("chats");
    ul.innerHTML = "";
    if (!items.length) { ul.innerHTML = '<li class="empty">Nobody is waiting on a reply.</li>'; return; }
    for (const it of items) {
      const t = timeLeft(it.at);
      const li = document.createElement("li");
      li.className = "chat" + (t.expired ? " expired" : "");
      li.innerHTML = '<div class="grow"><div class="who"></div><div class="preview"></div></div><div class="timer ' + t.cls + '"></div>';
      li.querySelector(".who").textContent = it.other.username ? "@" + it.other.username : "Unknown";
      li.querySelector(".preview").textContent = it.last.message || "[photo, voice note or share]";
      li.querySelector(".timer").textContent = t.text;
      li.onclick = () => openChat(it);
      ul.appendChild(li);
    }
  }

  // ---------- chat view ----------
  async function openChat(it) {
    current = it;
    show("chat");
    $("chatErr").textContent = "";
    $("chatName").textContent = it.other.username ? "@" + it.other.username : "Chat";
    $("openIg").href = it.other.username ? "https://ig.me/m/" + encodeURIComponent(it.other.username) : "https://www.instagram.com/direct/inbox/";
    $("msgs").innerHTML = '<p class="muted">Loading…</p>';
    $("replyText").value = store.get("draft_" + it.id) || "";
    try {
      const c = await api("/" + it.id, { fields: "messages.limit(20){id,from,message,created_time}" });
      const msgs = ((c.messages && c.messages.data) || []).slice().reverse();
      const box = $("msgs");
      box.innerHTML = "";
      for (const m of msgs) {
        const d = document.createElement("div");
        d.className = "msg" + (isMe(m.from) ? " me" : "");
        d.textContent = m.message || "[photo, voice note or share]";
        const tm = document.createElement("time");
        tm.textContent = new Date(m.created_time).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
        d.appendChild(tm);
        box.appendChild(d);
      }
      window.scrollTo(0, document.body.scrollHeight);
    } catch (e) { handleErr(e, "chatErr"); }
  }

  async function sendReply(ev) {
    ev.preventDefault();
    const text = $("replyText").value.trim();
    if (!text || !current) return;
    $("send").disabled = true;
    $("chatErr").textContent = "";
    try {
      await api(acct() + "/messages", {
        recipient: JSON.stringify({ id: current.other.id }),
        message: JSON.stringify({ text }),
      }, "POST");
      $("replyText").value = "";
      store.del("draft_" + current.id);
      await openChat(current);
    } catch (e) {
      $("chatErr").textContent = "Not sent: " + e.message + " Tap \"Open in IG\" to reply there. Your text is kept.";
    } finally {
      $("send").disabled = false;
    }
  }

  function handleErr(e, where) {
    if (e.code === 190) {               // invalid or expired key
      store.del("ig_token"); token = null; me = null;
      $("setupErr").textContent = "The access key has expired or been cancelled. Paste a new one.";
      show("setup");
      return;
    }
    $(where).textContent = (e instanceof TypeError)
      ? "Couldn't reach Instagram. Check your connection and try again."
      : e.message;
  }

  // ---------- wiring ----------
  $("saveToken").onclick = async () => {
    const v = $("tokenInput").value.trim();
    if (!v) return;
    token = v; me = null;
    $("setupErr").textContent = "";
    try {
      const typedId = $("igIdInput").value.trim();
      if (typedId) igId = typedId;
      me = await getMe();
      store.set("ig_token", token);
      if (igId) store.set("ig_id", igId);
      store.set("ig_token_refreshed", String(Date.now()));
      $("tokenInput").value = "";
      show("list"); loadList();
    } catch (e) {
      token = null;
      $("setupErr").textContent = "That key didn't work: " + e.message;
    }
  };
  $("refresh").onclick = loadList;
  $("back").onclick = () => { show("list"); loadList(); };
  $("composer").onsubmit = sendReply;
  $("replyText").oninput = e => { if (current) store.set("draft_" + current.id, e.target.value); };
  $("menu").onclick = () => { $("acctInfo").textContent = me ? "Connected to @" + me.username : ""; show("settings"); };
  $("settingsBack").onclick = () => show("list");
  $("forget").onclick = () => {
    store.del("ig_token"); store.del("ig_token_refreshed"); store.del("ig_id"); token = null; me = null; igId = null;
    show("setup");
  };
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && token && !$("list").classList.contains("hidden")) loadList();
  });

  if (token) { show("list"); maybeRefreshToken().then(loadList); } else { show("setup"); }
})();
</script>
</body>
</html>
